<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresh Stock — Fruit &amp; Vegetable Inventory</title>
  <meta name="description" content="A polished static demo inventory of fruits and vegetables with live quantities and a category filter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🧺</span>
        <div>
          <h1>Fresh Stock</h1>
          <p class="tagline">Fruit &amp; vegetable inventory &mdash; static GitHub Pages demo</p>
        </div>
      </div>
      <dl class="totals" aria-label="Inventory summary">
        <div><dt>Items</dt><dd id="stat-items">&mdash;</dd></div>
        <div><dt>Units in stock</dt><dd id="stat-units">&mdash;</dd></div>
        <div><dt>Low / out</dt><dd id="stat-low">&mdash;</dd></div>
      </dl>
    </header>

    <main>
      <section class="controls" aria-label="Filters">
        <div class="filter-group" role="group" aria-label="Filter by category">
          <button class="chip is-active" type="button" data-category="all">All</button>
          <button class="chip" type="button" data-category="fruit">Fruit</button>
          <button class="chip" type="button" data-category="vegetable">Vegetable</button>
          <button class="chip" type="button" data-category="herb">Herb</button>
        </div>
        <label class="search">
          <span class="visually-hidden">Search produce</span>
          <input id="search" type="search" placeholder="Search produce&hellip;" autocomplete="off" />
        </label>
      </section>

      <section class="inventory" aria-live="polite">
        <ul id="grid" class="grid"></ul>
        <p id="empty" class="empty" hidden>No produce matches this filter.</p>
      </section>
    </main>

    <footer class="colophon">
      <p>Static demo &mdash; data lives in <code>app.js</code>. Built with plain HTML, CSS &amp; JavaScript.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
